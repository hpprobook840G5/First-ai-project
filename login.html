<!DOCTYPE html>
<html>
    <head>
    <title>B18-Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="ChatGPT Image Jul 24, 2026, 12_27_54 PM.png" type="image/x-icon">
    </head>
    <body>
        <center>
        <form action="ud1.html">
            <div class="form-container">
                <div class="logo"><img src="ChatGPT Image Jul 24, 2026, 12_27_54 PM.png" alt="LOGO"></div>
                <div class="welcome">Welocme Back!</div>
                <div class="Email">
                    <label for="email" style="position: relative;right:17.5px"> Enter your Email:</label><br>
                    <input type="email" id="email" name="email" required placeholder="enter your email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                </div>
                <div class="password">
                    <label for="password" style="position: relative;right:17.5px">Enter your Password:</label><br>
                    <input type="password" required placeholder="enter your password" name="password" id="password">   <span id="eye" style="position:relative;top:6.5px;cursor: pointer;">👁️</span>
                </div>
                <div class="login">
                    <button type="submit">Login</button>
                </div>
                <div>
                    <a href="">Forgot Password?</a>
                </div>
                <div>Don't have an Account?</div>
                <div class="sign">
                    <a href="signup.html">Signup</a>
                </div>
            </div>
        </form>
        </center>
        <script src="login.js"></script>
    </body>
</html>
